<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Support Sentinel</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main>
      <section class="hero">
        <p class="eyebrow">Customer support agent prototype</p>
        <h1>Support Sentinel</h1>
        <p>Answers from approved policy, performs one guarded action, and knows when to escalate.</p>
      </section>
      <section class="chat-shell" aria-label="Customer support chat">
        <div class="chat-header"><span class="status-dot"></span><span>AI support agent</span><span class="safe">Safe mode</span></div>
        <div id="messages" class="messages" aria-live="polite">
          <article class="message agent">Hi! I can cite approved policy, cancel processing order <strong>ORD-1001</strong>, or route sensitive cases to the right human queue.</article>
        </div>
        <div class="suggestions">
          <button data-prompt="How long does standard shipping take?">Shipping times</button>
          <button data-prompt="Please cancel order ORD-1001">Cancel an order</button>
          <button data-prompt="Please cancel order ORD-2002">Shipped order</button>
          <button data-prompt="There is an unrecognized charge on my card">Report fraud</button>
        </div>
        <form id="composer"><input id="message" autocomplete="off" placeholder="Ask a support question…" aria-label="Your message" /><button>Send</button></form>
      </section>
    </main>
    <script type="module" src="/app.js"></script>
  </body>
</html>
